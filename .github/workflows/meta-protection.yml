name: Meta koruması
on:
  pull_request:
  push:
    branches: [main, codex/meta-manual-demo-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meta-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm run meta:verify
      - name: Taban sürümdeki korumayı da doğrula
        if: github.event_name == 'pull_request'
        env:
          META_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run meta:verify -- --baseline-ref "$META_BASE_SHA"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run security:check
