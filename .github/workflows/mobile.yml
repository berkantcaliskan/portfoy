name: Mobil uygulama
# Bu bilgisayarda Flutter çalışmadığı için mobil uygulama burada derlenir ve test edilir.
# Masaüstü uygulamasına dokunmaz: yalnızca mobile/ klasörü değiştiğinde çalışır.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_CHANNEL: stable
jobs:
  android:
    name: Android (analiz, test, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Flutter'ın 'kullanımdan kalkacak' bilgi notları derlemeyi durdurmaz; hata ve uyarılar durdurur
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: APK derle
        env:
          SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MOBILE_SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: portfoy-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS (imzasız derleme)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      # Telefona kurmak için Apple geliştirici hesabıyla imzalama gerekir; şimdilik derlenebildiği doğrulanır.
      - name: iOS derle (imzasız)
        env:
          SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MOBILE_SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
